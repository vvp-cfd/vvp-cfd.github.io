<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="Immersed-boundary flow past a rotor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a123f"/>
      <stop offset="0.55" stop-color="#4b206f"/>
      <stop offset="1" stop-color="#7e3aa8"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff794c" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#ff794c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb38f" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#d8b4fe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="bodyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff794c" stop-opacity="0.92"/>
      <stop offset="0.38" stop-color="#ff794c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff794c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600"/>
    <path d="M200 0V500M400 0V500M600 0V500M800 0V500M1000 0V500M1200 0V500M1400 0V500"/>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M-80 390C170 300 310 450 540 360S940 230 1180 310s330 40 520-30" stroke="url(#flow1)" stroke-width="3"/>
    <path d="M-80 330C180 250 340 390 570 305S980 175 1210 255s320 25 500-50" stroke="url(#flow2)" stroke-width="2"/>
    <path d="M-80 445C190 360 350 500 590 410S1000 290 1230 370s300 15 480-45" stroke="url(#flow2)" stroke-width="1.6" opacity="0.7"/>
    <path d="M-80 255C200 180 380 300 620 225S1030 95 1260 175s280 20 450-45" stroke="url(#flow1)" stroke-width="1.4" opacity="0.6"/>
  </g>

  <ellipse cx="1350" cy="250" rx="250" ry="210" fill="url(#bodyGlow)"/>

  <g transform="translate(1350 250) scale(1.05)">
    <g fill="none" stroke="#ffb38f" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.55" transform="scale(1.1)">
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(120)"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(240)"/>
    </g>

    <g fill="#21122f" stroke="#ff794c" stroke-width="3.2" stroke-linejoin="round">
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(120)"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(240)"/>
    </g>

    <g fill="none" stroke="#ffb38f" stroke-width="1.5" opacity="0.75">
      <path d="M0 -40C18 -66 31 -100 21 -124"/>
      <path d="M0 -40C18 -66 31 -100 21 -124" transform="rotate(120)"/>
      <path d="M0 -40C18 -66 31 -100 21 -124" transform="rotate(240)"/>
    </g>

    <circle r="15" fill="#ff794c"/>
    <circle r="25" fill="none" stroke="#ff794c" stroke-opacity="0.55" stroke-width="1.7"/>
  </g>

  <g fill="#ff794c">
