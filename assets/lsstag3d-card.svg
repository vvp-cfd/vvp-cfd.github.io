      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(120)"/>
      <path d="M0 -22C26 -52 48 -96 30 -136C12 -164 -26 -154 -34 -116C-42 -78 -22 -36 0 -22Z" transform="rotate(240)"/>
    </g>

