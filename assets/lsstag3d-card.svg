<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="LS-STAG-3D — immersed-boundary solver for arbitrary moving bodies and coupled problems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a123f"/>
      <stop offset="1" stop-color="#6d3197"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff794c"/>
      <stop offset="1" stop-color="#ffb38f"/>
